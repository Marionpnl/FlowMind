<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- SEO -->
    <meta
      name="description"
      content="FlowMind — planifie ta journée, garde une trace de tes lectures et laisse l'IA te suggérer comment recharger. Planification assistée par IA, bibliothèque de lecture et suggestions d'activités, réunies autour d'un système d'habitudes."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://flow-mind-gamma.vercel.app/" />

    <!-- Partage social (Open Graph + Twitter Card) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FlowMind" />
    <meta property="og:title" content="FlowMind" />
    <meta
      property="og:description"
      content="Ta journée, ta bibliothèque et tes envies — au même endroit."
    />
    <meta property="og:url" content="https://flow-mind-gamma.vercel.app/" />
    <meta property="og:image" content="https://flow-mind-gamma.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="fr_CH" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FlowMind" />
    <meta
      name="twitter:description"
      content="Ta journée, ta bibliothèque et tes envies — au même endroit."
    />
    <meta name="twitter:image" content="https://flow-mind-gamma.vercel.app/og-image.png" />

    <!-- Icônes -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Performance / rendu -->
    <meta name="theme-color" content="#fcfaf7" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowMind</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
